repos:
  - repo: local
    hooks:
      - id: cargo-clippy
        name: cargo clippy
        description: Lint Rust code with Clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-fmt
        name: cargo fmt
        description: Format Rust code with fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false