[workspace]
resolver = "3"
members = ["crates/mru", "crates/mru-cli"]

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "MIT"
authors = ["Kevin M. Gill <apoapsys@gmail.com>"]
description = "Utilities for working with publicly available raw NASA robotic flight mission data"
repository = "https://github.com/MarsRaw/mars-raw-utils"
readme = "README.md"
keywords = ["mars", "msl", "mars2020", "insight"]
exclude = ["mars-raw-utils-data"]


[workspace.dependencies]

# MarsRaw Ecosystem
mru = { path = "crates/mru" }
sciimg = { git = "https://github.com/MarsRaw/sciimg.git", branch = "main", features = [
    "rayon",
] }
#sciimg = { path = "../sciimg", features = ["rayon"] }
stump = { git = "https://github.com/MarsRaw/stump.git" }
vicar = { git = "https://github.com/MarsRaw/vicar-rs.git" }


# External
proc-macro2 = "1.0.106"
image = "0.25.9"
clap = { version = "4.2.7", features = ["derive"] }
serde_json = "1.0.64"
const_format = "0.2.14"
reqwest = { version = "0.13.1", features = ["stream"] }
platforms = "4.2.1"
lab = "0.11.0"
toml = "1.0.6"
serde = { version = "1.0.125", features = ["derive"] }
string-builder = "0.2.0"
weezl = "0.2.1"
gif = "0.14.1"
rayon = "1.7.0"
chrono = { version = "0.4.19", features = ["serde"] }
dirs = "7.0.0"
wild = "2.0.4"
colored = "3.1.1"
backtrace = "0.3.65"
termsize = "0.1.6"
lazy_static = "1.4.0"
anyhow = "1.0.65"
bytes = "1.2.1"
thiserror = "2.0.18"
tokio = { version = "1.21.2", features = ["full"] }
glob = "0.3.0"
regex = "1.7.0"
url = "2.3.1"
tempfile = "3.5.0"
futures-util = "0.3.28"
indicatif = "0.18.3"
cli-table = "0.5.0"
itertools = "0.15.0"
futures = "0.3.28"
dng = "1.5.0"
clap_complete = "4.3.1"
dateparser = "0.3.1"
quick-xml = { version = "0.42", features = ["serialize", "overlapped-lists"] }
num-format = "0.4"

[workspace.lints.clippy]
too_many_arguments = "deny"
wildcard_imports = "deny"
todo = "deny"

[profile.release]
strip = true # Automatically strip symbols from the binary.
#debug = 2

[patch.crates-io]
jpeg-decoder = { git = "https://github.com/MarsRaw/jpeg-decoder.git", branch = "optional-zero-ac63" }
