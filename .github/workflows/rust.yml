name: Rust

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:

  check:
    name: "Cargo check"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Checkout repo"
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - uses: "actions-rs/toolchain@v1"
      with:
        profile: "minimal"
        toolchain: "stable"
        override: true
    - uses: "actions-rs/cargo@v1"
      with:
        command: "check"
    
  test:
    name: "Cargo test"
    runs-on: "ubuntu-latest"
    env: 
      MARS_LOG_AT_LEVEL: "debug"
      RUST_BACKTRACE: 1
    steps:
    - name: "Checkout repo"
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - uses: "actions-rs/toolchain@v1"
      with:
        profile: "minimal"
        toolchain: "stable"
        override: true

    - uses: "actions-rs/cargo@v1"
      with:
        command: "test"
        args: "-p mru -p mru-cli --no-fail-fast -- --nocapture --skip test_psyche_instrument_fetches"

  fmt:
    name: "Cargo format"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Checkout repo"
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - uses: "actions-rs/toolchain@v1"
      with:
        profile: "minimal"
        toolchain: "stable"
        override: true

    - run: "rustup component add rustfmt"
    
    - uses: "actions-rs/cargo@v1"
      with:
        command: "fmt"
        args: "--all -- --check"

  clippy:
    name: "Cargo clippy"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Checkout repo"
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - uses: "actions-rs/toolchain@v1"
      with:
        profile: "minimal"
        toolchain: "stable"
        override: true

    - run: "rustup component add clippy"
    
    - uses: "actions-rs/cargo@v1"
      with:
        command: "clippy"
        args: "-- -D warnings"
